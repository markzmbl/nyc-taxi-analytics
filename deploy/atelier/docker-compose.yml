# Atelier tier — Docker Compose footprint.
#
# Brings up the warehouse engine as a service. ClickHouse single-node is the
# server-backed default; DuckDB needs no server (Studio) and MotherDuck is
# managed (cloud), so this compose only defines the ClickHouse engine. Dagster
# and the serving slot (Metabase/Superset/Cube) are layered on in Phase 3.
#
# Requires the clickhouse extra:  pip install -e ".[clickhouse]"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-warehouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"   # HTTP (dbt/dlt)
      - "9000:9000"                       # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  clickhouse-data:
