# OpenHands — autonomous coding agent on your box, using z.ai via LiteLLM.
#
#   cd infra/openhands
#   cp .env.example .env          # fill in LLM_API_KEY (your z.ai key)
#   docker compose up
#
# UI: http://localhost:3311   (host port 3311 on purpose — Dagster uses 3000)
#
# Pin the image tags for anything beyond a quick try; verify current tags +
# the z.ai endpoint/model against the OpenHands and z.ai docs (both drift).

services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    container_name: openhands
    pull_policy: always
    stdin_open: true
    tty: true
    ports:
      - "3311:3000"
    environment:
      # LiteLLM routing → z.ai's OpenAI-compatible endpoint
      LLM_MODEL: ${LLM_MODEL:-openai/glm-4.6}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.z.ai/api/paas/v4}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in infra/openhands/.env}
      # the sandbox OpenHands spawns to run code
      SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.all-hands.dev/all-hands-ai/runtime:latest-nikolaik
      LOG_ALL_EVENTS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # OpenHands spawns the runtime container
      - ~/.openhands:/.openhands                     # persistent state/settings
    extra_hosts:
      - "host.docker.internal:host-gateway"
