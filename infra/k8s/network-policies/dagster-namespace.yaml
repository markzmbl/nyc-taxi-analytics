###############################################################################
# NetworkPolicy — dagster namespace
#
# Rules:
#   - Allow ingress from the airbyte namespace (Airbyte server, for API calls)
#   - Allow ingress from the metabase namespace (if Metabase is in its own ns)
#   - Allow ingress within the dagster namespace (webserver <-> daemon <-> user code)
#   - Allow egress to postgres namespace (5432)
#   - Allow egress to the airbyte namespace (Airbyte API calls)
#   - Allow DNS egress (kube-dns, UDP+TCP 53)
#
# Apply:
#   kubectl apply -f dagster-namespace.yaml -n dagster
###############################################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dagster-allow
  namespace: dagster
spec:
  podSelector: {}                     # all pods in the dagster namespace
  policyTypes:
    - Ingress
    - Egress
  # ── Ingress rules ────────────────────────────────────────────────────────────
  ingress:
    # Allow from airbyte namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airbyte
    # Allow from metabase namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metabase
    # Allow within dagster namespace (inter-service communication)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dagster
  # ── Egress rules ─────────────────────────────────────────────────────────────
  egress:
    # Allow egress to postgres namespace on port 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to airbyte namespace (Airbyte API)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: airbyte
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
