###############################################################################
# K8s secrets — replace with External Secrets Operator or Vault in production
# Usage: kubectl apply -f secrets.yaml -n dagster
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgres-secret
  namespace: dagster
type: Opaque
stringData:
  password: "${PG_PASSWORD}"

---
apiVersion: v1
kind: Secret
metadata:
  name: dagster-airbyte-secret
  namespace: dagster
type: Opaque
stringData:
  workspace_id: "${AIRBYTE_WORKSPACE_ID}"
  username: "${AIRBYTE_USERNAME}"
  password: "${AIRBYTE_PASSWORD}"

---
apiVersion: v1
kind: Secret
metadata:
  name: dagster-epa-secret
  namespace: dagster
type: Opaque
stringData:
  api_key: "${EPA_API_KEY}"
  email: "${EPA_EMAIL}"
