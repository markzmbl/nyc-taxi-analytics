###############################################################################
# Dagster OSS — Helm values
# Repo:  https://dagster-io.github.io/helm
# Chart: dagster/dagster
# Usage: helm upgrade --install dagster dagster/dagster \
#          -n dagster --create-namespace -f values.yaml
###############################################################################

# Postgres for Dagster (runs, event log, schedule storage)
postgresql:
  enabled: false  # use external Postgres

dagster-user-deployments:
  enabled: true
  deployments:
    - name: nyc-taxi-analytics
      image:
        repository: ${container_registry}/nyc-taxi-analytics
        tag: ${container_image_tag}
        pullPolicy: Always

      dagsterApiGrpcArgs:
        - "--python-file"
        - "/app/orchestration/definitions.py"

      port: 3030

      env:
        - name: PG_HOST
          value: ${pg_host}
        - name: PG_USER
          value: ${pg_admin_user}
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dagster-postgres-secret
              key: password
        - name: AIRBYTE_REST_API_BASE_URL
          value: "http://airbyte-airbyte-server-svc.airbyte.svc.cluster.local:8001/api/public/v1"
        - name: AIRBYTE_CONFIGURATION_API_BASE_URL
          value: "http://airbyte-airbyte-server-svc.airbyte.svc.cluster.local:8001/api/v1"
        - name: AIRBYTE_WORKSPACE_ID
          valueFrom:
            secretKeyRef:
              name: dagster-airbyte-secret
              key: workspace_id
        - name: AIRBYTE_USERNAME
          valueFrom:
            secretKeyRef:
              name: dagster-airbyte-secret
              key: username
        - name: AIRBYTE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dagster-airbyte-secret
              key: password
        - name: DAGSTER_POSTGRES_HOST
          value: ${pg_host}
        - name: DAGSTER_POSTGRES_USER
          value: ${pg_admin_user}
        - name: DAGSTER_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dagster-postgres-secret
              key: password
        - name: DAGSTER_POSTGRES_DB
          value: dagster
        - name: EPA_API_KEY
          valueFrom:
            secretKeyRef:
              name: dagster-epa-secret
              key: api_key
        - name: EPA_EMAIL
          valueFrom:
            secretKeyRef:
              name: dagster-epa-secret
              key: email
        - name: DAGSTER_HOME
          value: /opt/dagster/dagster_home

      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 2Gi

# ── Run worker resource limits ──────────────────────────────────────────────
# K8sRunLauncher creates a Job pod per pipeline run. Without resource requests,
# these pods can be evicted under node pressure or fail to schedule. The limits
# below guarantee each run worker gets enough memory/CPU to complete. This
# addresses the run 4f34a210 eviction (run worker pod disappeared under
# memory pressure on the single-node Kind cluster).
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      runK8sConfig:
        containerConfig:
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 4Gi

dagsterWebserver:
  enableReadOnly: false
  service:
    type: NodePort
    nodePort: 30080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

dagsterDaemon:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
