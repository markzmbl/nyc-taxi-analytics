###############################################################################
# ClusterSecretStore — Azure Key Vault
#
# Prerequisites:
#   1. Create an Azure Key Vault:
#        az keyvault create --name nyc-taxi-kv --resource-group rg-nyc-taxi \
#          --location eastus
#
#   2. Create secrets in Key Vault:
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name dagster-postgres-password --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name airbyte-postgres-password --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name minio-access-key --value "minioadmin"
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name minio-secret-key --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name airbyte-workspace-id --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name airbyte-username --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name airbyte-password --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name epa-api-key --value "..."
#        az keyvault secret set --vault-name nyc-taxi-kv \
#          --name epa-email --value "..."
#
#   3. Grant ESO access to Key Vault via Workload Identity (preferred) or
#      Service Principal. For Workload Identity with AKS:
#        - Enable OIDC issuer and Workload Identity on AKS
#        - Create a User-Assigned Managed Identity
#        - Assign "Key Vault Secrets User" RBAC role to the identity
#        - Federate the ESO service account with the managed identity:
#            az identity federated-credential create \
#              --name eso-fc --identity-name eso-identity \
#              --resource-group rg-nyc-taxi \
#              --issuer "https://westeurope.oic.prod-aks.azure.com/..." \
#              --subject "system:serviceaccount:external-secrets:external-secrets"
#   Or for Service Principal (simpler for non-production):
#        az ad sp create-for-rbac --name eso-sp --role "Key Vault Secrets User" \
#          --scopes /subscriptions/SUB_ID/resourceGroups/rg-nyc-taxi/providers/Microsoft.KeyVault/vaults/nyc-taxi-kv
#        kubectl create secret generic azure-secret-sp \
#          --from-literal ClientID=... --from-literal ClientSecret=... \
#          -n external-secrets
###############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      # Replace with your Key Vault URL
      vaultUrl: https://nyc-taxi-kv.vault.azure.net/
      # For Workload Identity (recommended), no authSecretRef needed —
      # ESO uses the pod's managed identity via Azure SDK auto-detection.
      # For Service Principal, uncomment:
      # authSecretRef:
      #   clientId:
      #     name: azure-secret-sp
      #     key: ClientID
      #   clientSecret:
      #     name: azure-secret-sp
      #     key: ClientSecret
