###############################################################################
# ClusterSecretStore — AWS Secrets Manager
#
# Prerequisites:
#   1. Create secrets in AWS Secrets Manager (e.g. via AWS Console or CLI):
#        aws secretsmanager create-secret --name nyc-taxi/dagster-postgres \
#          --secret-string '{"password":"..."}' --region us-east-1
#        aws secretsmanager create-secret --name nyc-taxi/airbyte-postgres \
#          --secret-string '{"password":"..."}' --region us-east-1
#        aws secretsmanager create-secret --name nyc-taxi/minio \
#          --secret-string '{"access-key":"minioadmin","secret-key":"..."}' --region us-east-1
#        aws secretsmanager create-secret --name nyc-taxi/airbyte-auth \
#          --secret-string '{"username":"...","password":"...","workspace_id":"..."}' --region us-east-1
#        aws secretsmanager create-secret --name nyc-taxi/epa-api \
#          --secret-string '{"api_key":"...","email":"..."}' --region us-east-1
#
#   2. Grant ESO's IAM role (IRSA or node role) permission to read secrets:
#        {
#          "Effect": "Allow",
#          "Action": ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"],
#          "Resource": "arn:aws:secretsmanager:*:*:secret:nyc-taxi/*"
#        }
#
#   For IRSA (preferred):
#     - Create an IAM OIDC provider for the EKS cluster
#     - Annotate the ESO service account with the IAM role ARN:
#         kubectl annotate sa -n external-secrets external-secrets \
#           eks.amazonaws.com/role-arn=arn:aws:iam::ACCOUNT:role/eso-secrets-reader
###############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # match your deployment region
      # auth: ESO auto-detects IRSA web identity, EC2 instance role,
      # or environment variables. No explicit auth block needed for IRSA.
