###############################################################################
# ClusterSecretStore — GCP Secret Manager
#
# Prerequisites:
#   1. Enable Secret Manager API:
#        gcloud services enable secretmanager.googleapis.com
#
#   2. Create secrets:
#        echo -n "..." | gcloud secrets create nyc-taxi-dagster-postgres-password \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-airbyte-postgres-password \
#          --data-file=- --replication-policy=automatic
#        echo -n "minioadmin" | gcloud secrets create nyc-taxi-minio-access-key \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-minio-secret-key \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-airbyte-workspace-id \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-airbyte-username \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-airbyte-password \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-epa-api-key \
#          --data-file=- --replication-policy=automatic
#        echo -n "..." | gcloud secrets create nyc-taxi-epa-email \
#          --data-file=- --replication-policy=automatic
#
#   3. Grant ESO's service account access (Workload Identity preferred):
#        gcloud iam service-accounts add-iam-policy-binding \
#          eso-sa@PROJECT.iam.gserviceaccount.com \
#          --role roles/iam.workloadIdentityUser \
#          --member "serviceAccount:PROJECT.svc.id.goog[external-secrets/external-secrets]"
#        gcloud projects add-iam-policy-binding PROJECT \
#          --member "serviceAccount:eso-sa@PROJECT.iam.gserviceaccount.com" \
#          --role roles/secretmanager.secretAccessor
#
#   Annotate the ESO service account:
#     kubectl annotate sa -n external-secrets external-secrets \
#       iam.gke.io/gcp-service-account=eso-sa@PROJECT.iam.gserviceaccount.com
###############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: YOUR_PROJECT_ID  # replace with your GCP project ID
      # auth: Workload Identity is auto-detected from the GKE metadata server.
      # No explicit auth block needed when the SA has the appropriate IAM binding.
