###############################################################################
# ExternalSecret resources — sync cloud secrets into K8s Secrets
#
# These ExternalSecrets reference the ClusterSecretStore for your cloud
# provider. ESO periodically syncs the remote secrets into native Kubernetes
# Secret objects in the target namespaces.
#
# Target secrets created by these ExternalSecrets:
#   dagster namespace:
#     - dagster-postgres-secret     (key: password)
#     - dagster-airbyte-secret      (keys: workspace_id, username, password)
#     - dagster-epa-secret          (keys: api_key, email)
#     - dagster-minio-secret        (keys: access-key, secret-key)
#   airbyte namespace:
#     - airbyte-postgres-secret     (key: password)
#     - airbyte-minio-secret        (keys: access-key, secret-key)
#
# Cloud-provider mapping — use the store for your deployment:
#   AWS:     aws-secrets-manager   (see cluster-secret-store-aws.yaml)
#   Azure:   azure-key-vault       (see cluster-secret-store-azure.yaml)
#   GCP:     gcp-secret-manager    (see cluster-secret-store-gcp.yaml)
#
# Apply:
#   kubectl apply -f external-secrets.yaml
#
# NOTE: Replace STORE_NAME below with the store matching your cloud provider.
###############################################################################
---
# ── dagster namespace ──────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-postgres
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: STORE_NAME   # <-- replace with aws-secrets-manager | azure-key-vault | gcp-secret-manager
  target:
    name: dagster-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        # AWS:  key: nyc-taxi/dagster-postgres    property: password
        # Azure:  key: dagster-postgres-password
        # GCP:    key: nyc-taxi-dagster-postgres-password
        key: nyc-taxi/dagster-postgres
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-airbyte
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: STORE_NAME
  target:
    name: dagster-airbyte-secret
    creationPolicy: Owner
  data:
    - secretKey: workspace_id
      remoteRef:
        key: nyc-taxi/airbyte-auth
        property: workspace_id
    - secretKey: username
      remoteRef:
        key: nyc-taxi/airbyte-auth
        property: username
    - secretKey: password
      remoteRef:
        key: nyc-taxi/airbyte-auth
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-epa
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: STORE_NAME
  target:
    name: dagster-epa-secret
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: nyc-taxi/epa-api
        property: api_key
    - secretKey: email
      remoteRef:
        key: nyc-taxi/epa-api
        property: email
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dagster-minio
  namespace: dagster
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: STORE_NAME
  target:
    name: dagster-minio-secret
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: nyc-taxi/minio
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: nyc-taxi/minio
        property: secret-key
---
# ── airbyte namespace ──────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airbyte-postgres
  namespace: airbyte
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: STORE_NAME
  target:
    name: airbyte-postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: nyc-taxi/airbyte-postgres
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airbyte-minio
  namespace: airbyte
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: STORE_NAME
  target:
    name: airbyte-minio-secret
    creationPolicy: Owner
  data:
