version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: taxi_trips
        description: >
          Yellow taxi trips loaded via Airbyte from Azure Open Datasets Parquet.
          Columns preserve original Parquet camelCase (Airbyte default). 
          **Stream was renamed from "yellow" to "taxi_trips" — the Airbyte connection
          now writes to `raw.taxi_trips` instead of `raw.yellow`.** 
          TLC publishes yellow taxi data monthly (Parquet), typically 30–45 days
          after month-end.
        freshness:
          warn_after: { count: 35, period: day }
        loaded_at_field: _airbyte_loaded_at
        columns:
          - name: vendorID
            description: "TPEP vendor code (1=Creative Mobile Technologies, 2=VeriFone)."
          - name: tpepPickupDateTime
            description: "Trip pickup timestamp."
          - name: tpepDropoffDateTime
            description: "Trip dropoff timestamp."
          - name: passengerCount
            description: "Number of passengers reported by driver."
          - name: tripDistance
            description: "Trip distance in miles (odometer-reported)."
          - name: puLocationId
            description: "TLC taxi zone ID for pickup location."
          - name: doLocationId
            description: "TLC taxi zone ID for dropoff location."
          - name: rateCodeId
            description: "Rate code (1=Standard, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=Negotiated, 6=Group)."
          - name: storeAndFwdFlag
            description: "Whether trip record was held in vehicle memory before sending (Y/N)."
          - name: paymentType
            description: "Payment type code (1=Credit, 2=Cash, 3=No charge, 4=Dispute, 5=Unknown, 6=Voided)."
          - name: fareAmount
            description: "Time-and-distance fare calculated by meter."
          - name: extra
            description: "Miscellaneous extras and surcharges (peak-hour, overnight)."
          - name: mtaTax
            description: "MTA tax (currently $0.50)."
          - name: tipAmount
            description: "Tip amount (credit card only; cash tips not recorded)."
          - name: tollsAmount
            description: "Total tolls paid during trip."
          - name: improvementSurcharge
            description: "Improvement surcharge (currently $0.30)."
          - name: totalAmount
            description: "Total amount charged to passenger."

      - name: taxi_trips_green
        description: >
          Green (borough) taxi trips loaded via Airbyte from Azure Open Datasets Parquet.
          Green taxis serve outer boroughs and northern Manhattan — no street hails
          below W 110th St or E 96th St.  TLC publishes monthly Parquet files.
          Note: Airbyte normalized all column names to lowercase without underscores
          (e.g., lpeppickupdatetime, pulocationid).
        freshness:
          warn_after: { count: 35, period: day }
        loaded_at_field: _airbyte_loaded_at
        columns:
          - name: vendorid
            description: "TPEP vendor code."
          - name: lpeppickupdatetime
            description: "Trip pickup timestamp."
            tests:
              - not_null
          - name: lpepdropoffdatetime
            description: "Trip dropoff timestamp."
            tests:
              - not_null
          - name: passengercount
            description: "Number of passengers reported by driver."
          - name: tripdistance
            description: "Trip distance in miles (odometer-reported)."
          - name: pulocationid
            description: "TLC taxi zone ID for pickup location."
            tests:
              - not_null
          - name: dolocationid
            description: "TLC taxi zone ID for dropoff location."
            tests:
              - not_null
          - name: ratecodeid
            description: "Rate code."
          - name: storeandfwdflag
            description: "Whether trip record was held in vehicle memory."
          - name: paymenttype
            description: "Payment type code."
          - name: fareamount
            description: "Time-and-distance fare."
          - name: extra
            description: "Miscellaneous extras and surcharges."
          - name: mtatax
            description: "MTA tax."
          - name: tipamount
            description: "Tip amount."
          - name: tollsamount
            description: "Total tolls."
          - name: ehailfee
            description: "E-hail fee (green taxi only)."
          - name: improvementsurcharge
            description: "Improvement surcharge."
          - name: totalamount
            description: "Total amount charged."
          - name: triptype
            description: "Trip type (1=Street-hail, 2=Dispatch)."

      - name: taxi_trips_fhv
        description: >
          For-Hire Vehicle (FHV) trips — traditional black cars, livery, limousines.
          Loaded via Airbyte from Azure Open Datasets Parquet.  TLC publishes monthly.
          Unlike yellow/green taxis, FHV does not record fare/payment data.
          Note: Airbyte normalized all column names to lowercase without underscores
          (e.g., dispatchbasenum, pickupdatetime).  Many FHV trips lack dropoff
          location data (dolocationid is frequently NULL).
        freshness:
          warn_after: { count: 35, period: day }
        loaded_at_field: _airbyte_loaded_at
        columns:
          - name: dispatchbasenum
            description: "TLC-issued base license number of the dispatching base."
          - name: pickupdatetime
            description: "Trip pickup timestamp."
            tests:
              - not_null
          - name: dropoffdatetime
            description: "Trip dropoff timestamp."
          - name: pulocationid
            description: "TLC taxi zone ID for pickup location."
          - name: dolocationid
            description: "TLC taxi zone ID for dropoff location."
          - name: srflag
            description: "Shared ride flag (Y if trip was a shared ride)."

      - name: taxi_trips_fhvhv
        description: >
          High-Volume For-Hire Vehicle (FHVHV) trips — Uber, Lyft, Via, Juno.
          Loaded via Airbyte from Azure Open Datasets Parquet.  TLC publishes monthly.
          Includes detailed fare breakdowns and shared-ride / accessibility flags.
        freshness:
          warn_after: { count: 35, period: day }
        loaded_at_field: _airbyte_loaded_at
        columns:
          - name: hvfhs_license_num
            description: "TLC-issued HVFHS license number (identifies the base, e.g., Uber, Lyft)."
          - name: dispatching_base_num
            description: "Base license number of the dispatching base."
          - name: originating_base_num
            description: "Base number of the base that originally dispatched the trip."
          - name: request_datetime
            description: "Datetime the trip was requested by the passenger."
          - name: on_scene_datetime
            description: "Datetime the driver arrived at the pickup location."
          - name: pickup_datetime
            description: "Trip pickup timestamp."
            tests:
              - not_null
          - name: dropoff_datetime
            description: "Trip dropoff timestamp."
            tests:
              - not_null
          - name: pulocationid
            description: "TLC taxi zone ID for pickup location."
            tests:
              - not_null
          - name: dolocationid
            description: "TLC taxi zone ID for dropoff location."
            tests:
              - not_null
          - name: trip_miles
            description: "Trip distance in miles."
          - name: trip_time
            description: "Trip duration in seconds."
          - name: base_passenger_fare
            description: "Base passenger fare before surcharges/tolls/tips."
          - name: tolls
            description: "Total tolls paid."
          - name: bcf
            description: "Black Car Fund surcharge."
          - name: sales_tax
            description: "Sales tax."
          - name: congestion_surcharge
            description: "Congestion surcharge."
          - name: airport_fee
            description: "Airport fee (JFK/LGA)."
          - name: tips
            description: "Tip amount."
          - name: driver_pay
            description: "Driver pay (base fare + tips - commission)."
          - name: shared_request_flag
            description: "Whether the passenger requested a shared ride (Y/N)."
          - name: shared_match_flag
            description: "Whether a shared ride was matched (Y/N)."
          - name: access_a_ride_flag
            description: "Whether the trip was an Access-A-Ride trip (Y/N)."
          - name: wav_request_flag
            description: "Whether the passenger requested a WAV (wheelchair accessible vehicle)."
          - name: wav_match_flag
            description: "Whether a WAV was matched for the trip."

      - name: weather
        description: >
          NYC-area weather loaded via Azure Blob REST API + PyArrow station filter
          (JSONB payload).  Covers 13 NOAA ISD stations in the NYC metro area.
        columns:
          - name: payload
            tests:
              - not_null

      - name: holidays
        description: >
          US federal holidays generated via the ``holidays`` Python package
          (JSONB payload).  Load-once reference data.
        columns:
          - name: payload
            tests:
              - not_null

      - name: subway_turnstiles
        description: MTA turnstile data loaded via Python from weekly CSV dumps.
        columns:
          - name: observed_at
            tests:
              - not_null

      - name: citibike_trips
        description: >
          Full NYC Citi Bike trip data (NYC + Jersey City) loaded via Airbyte
          from the public S3 bucket.  ~2M trips/month.  Full-refresh sync.
        freshness:
          warn_after: { count: 48, period: hour }
          error_after: { count: 168, period: hour }
        loaded_at_field: _airbyte_loaded_at
        columns:
          - name: starttime
            tests:
              - not_null

      - name: complaints_311
        description: >
          NYC 311 complaints loaded via Socrata API (JSONB payload).
          Incremental by created_date watermark.
        columns:
          - name: payload
            tests:
              - not_null

      - name: event_permits
        description: >
          NYC event permits loaded via Socrata API (JSONB payload).
          Incremental by start_date_time watermark.
        columns:
          - name: payload
            tests:
              - not_null

      - name: air_quality
        description: EPA AQS daily air quality data (JSONB payload).  EPA_API_KEY required.
        columns:
          - name: payload
            tests:
              - not_null

      - name: restaurant_inspections
        description: >
          NYC DOHMH restaurant inspections (JSONB payload, nested violations array).
          Incremental by inspection_date watermark.
        columns:
          - name: payload
            tests:
              - not_null

      - name: nypd_complaints
        description: >
          NYPD complaint data with geospatial fields (JSONB payload).
          Incremental by cmplnt_fr_dt watermark.
        columns:
          - name: payload
            tests:
              - not_null
