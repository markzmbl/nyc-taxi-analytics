version: 2

models:
  - name: stg_taxi_trips
    description: Cleaned yellow taxi trip records (relational, loaded via Airbyte).
    columns:
      - name: pickup_datetime
        tests:
          - not_null
      - name: dropoff_datetime
        tests:
          - not_null
      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('taxi_zone_lookup')
              field: location_id
      - name: dropoff_location_id
        tests:
          - not_null
          - relationships:
              to: ref('taxi_zone_lookup')
              field: location_id
      - name: payment_type
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]

  - name: stg_taxi_trips_green
    description: Cleaned green (borough) taxi trip records loaded via Airbyte.
    columns:
      - name: pickup_datetime
        tests:
          - not_null
      - name: dropoff_datetime
        tests:
          - not_null
      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('taxi_zone_lookup')
              field: location_id
      - name: dropoff_location_id
        tests:
          - not_null
          - relationships:
              to: ref('taxi_zone_lookup')
              field: location_id
      - name: payment_type
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
      - name: trip_type
        tests:
          - accepted_values:
              values: [1, 2]

  - name: stg_taxi_trips_fhv
    description: Cleaned For-Hire Vehicle trip records loaded via Airbyte. No fare data.
    columns:
      - name: dispatching_base_num
        description: "TLC base license number — identifies the dispatching company."
        tests:
          - not_null
      - name: pickup_datetime
        tests:
          - not_null

  - name: stg_taxi_trips_fhvhv
    description: Cleaned High-Volume FHV trip records (Uber, Lyft, etc.) loaded via Airbyte.
    columns:
      - name: hvfhs_license_num
        description: "HVFHS license — identifies the base (Uber, Lyft, Via, Juno)."
        tests:
          - not_null
      - name: pickup_datetime
        tests:
          - not_null
      - name: dropoff_datetime
        tests:
          - not_null
      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('taxi_zone_lookup')
              field: location_id
      - name: dropoff_location_id
        tests:
          - not_null
          - relationships:
              to: ref('taxi_zone_lookup')
              field: location_id

  - name: stg_weather
    description: NYC-area hourly weather observations.
    columns:
      - name: observation_datetime
        tests:
          - not_null
      - name: station_id
        tests:
          - not_null

  - name: stg_holidays
    description: US public holidays with normalized names.
    columns:
      - name: holiday_date
        tests:
          - not_null
      - name: holiday_name
        tests:
          - not_null

  - name: stg_subway_turnstiles
    description: MTA turnstile observations with computed entry/exit deltas.
    columns:
      - name: observed_at
        tests:
          - not_null
      - name: station
        tests:
          - not_null
      - name: entry_delta
        tests:
          - not_null
      - name: exit_delta
        tests:
          - not_null

  - name: stg_citibike_trips
    description: Cleaned Citi Bike trip records loaded via HTTPS from public S3.
    columns:
      - name: started_at
        tests:
          - not_null
      - name: ended_at
        tests:
          - not_null
      - name: start_station_id
        tests:
          - not_null
      - name: end_station_id
        tests:
          - not_null

  - name: stg_311_complaints
    description: NYC 311 service request complaints extracted from JSONB.
    columns:
      - name: complaint_id
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: complaint_type
        tests:
          - not_null

  - name: stg_event_permits
    description: NYC event permits extracted from JSONB.
    columns:
      - name: event_id
        tests:
          - not_null
      - name: start_at
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null

  - name: stg_air_quality
    description: EPA AQS daily air quality observations extracted from JSONB.
    columns:
      - name: observation_date
        tests:
          - not_null
      - name: parameter_code
        tests:
          - not_null
      - name: arithmetic_mean
        tests:
          - not_null

  - name: stg_restaurant_inspections
    description: >
      Restaurant inspection records with unnested violations.
      Shredded from nested JSONB — each violation is a row.
    columns:
      - name: camis
        tests:
          - not_null
      - name: inspection_date
        tests:
          - not_null
      - name: grade
        description: "Inspection grade (A/B/C).  Null when not yet graded."

  - name: stg_nypd_complaints
    description: >
      NYPD complaint data flattened from JSONB for geospatial joins.
      Includes suspect/victim demographics and coordinates.
    columns:
      - name: complaint_num
        tests:
          - not_null
      - name: complaint_date
        tests:
          - not_null
      - name: boro
        tests:
          - not_null
