version: 2

models:
  - name: dim_taxi_zones
    description: Taxi zone dimension from TLC lookup (seed-based).
    columns:
      - name: location_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: Date spine from 2018-01-01 to 2024-12-31.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: dim_weather
    description: Daily weather aggregates joined to date spine.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day

  - name: dim_holidays
    description: Holiday flags joined to date spine.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day

  - name: fact_trips
    description: >
      Incremental fact table unifying all four TLC taxi types: yellow
      (medallion), green (borough), FHV (traditional for-hire vehicles),
      and FHVHV (high-volume for-hire vehicles — Uber, Lyft, etc.).
      FHV trips have no fare, passenger, or distance data; FHVHV trips
      have a distinct fare structure mapped to shared columns.
      Excludes H2 2019+ (data quality cutoff).
    columns:
      - name: trip_surrogate_key
        tests:
          - unique:
              config:
                where: "taxi_type != 'fhv'"
                severity: warn
          - not_null
      - name: taxi_type
        description: "Taxi service type — yellow, green, fhv, or fhvhv."
        tests:
          - not_null
          - accepted_values:
              values: ['yellow', 'green', 'fhv', 'fhvhv']
      - name: vendor_id
        description: "TPEP vendor code (yellow/green only; NULL for FHV/FHVHV)."
      - name: base_identifier
        description: "Base license identifier — vendor_id for yellow/green, dispatching_base_num for FHV, hvfhs_license_num for FHVHV."
        tests:
          - not_null
      - name: pickup_datetime
        tests:
          - not_null
      - name: dropoff_datetime
        tests:
          - not_null
      - name: pickup_location_id
        tests:
          - not_null:
              config:
                where: "taxi_type != 'fhv'"
          - relationships:
              to: ref('dim_taxi_zones')
              field: location_id
              config:
                where: "taxi_type != 'fhv'"
      - name: dropoff_location_id
        tests:
          - not_null:
              config:
                where: "taxi_type != 'fhv'"
          - relationships:
              to: ref('dim_taxi_zones')
              field: location_id
              config:
                where: "taxi_type != 'fhv'"
      - name: payment_type
        description: "Payment type (yellow/green only; NULL for FHV/FHVHV)."
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
              config:
                where: "taxi_type in ('yellow', 'green')"

  - name: agg_flow_zone
    description: Zone-to-zone trip flow aggregation at multiple granularities.
    columns:
      - name: trip_count
        tests:
          - not_null

  - name: agg_flow_borough
    description: Borough-to-borough trip flow aggregation at multiple granularities.
    columns:
      - name: trip_count
        tests:
          - not_null

  - name: dim_subway_stations
    description: Subway station dimension with nearest taxi zone mapping.
    columns:
      - name: station_complex_id
        tests:
          - unique
          - not_null

  - name: dim_citibike_stations
    description: Citi Bike station dimension with nearest taxi zone mapping.
    columns:
      - name: station_id
        tests:
          - unique
          - not_null

  - name: fact_subway_entries
    description: Daily subway station entry/exit aggregates.
    columns:
      - name: entry_key
        tests:
          - unique
          - not_null
      - name: observed_date
        tests:
          - not_null
      - name: total_entries
        tests:
          - not_null

  - name: fact_citibike_trips
    description: >
      Incremental fact table of Citi Bike trips.
      Excludes H2 2019+ (data quality cutoff alignment).
    columns:
      - name: trip_surrogate_key
        tests:
          - unique
          - not_null
      - name: started_at
        tests:
          - not_null
      - name: start_station_id
        tests:
          - not_null

  - name: fact_311_complaints
    description: >
      Incremental fact table of 311 service request complaints
      with spatial taxi zone mapping.
    columns:
      - name: complaint_id
        tests:
          - unique
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: complaint_type
        tests:
          - not_null

  - name: fact_event_permits
    description: NYC event permits with duration calculation.
    columns:
      - name: event_id
        tests:
          - not_null
      - name: start_at
        tests:
          - not_null

  - name: fact_air_quality
    description: EPA daily air quality observations with taxi zone mapping.
    columns:
      - name: air_quality_key
        tests:
          - unique
          - not_null
      - name: observation_date
        tests:
          - not_null

  - name: agg_modal_daily
    description: >
      Cross-modal daily summary joining all four taxi types, subway,
      citibike, 311, events, air quality, weather, and holidays.
      Includes per-taxi-type trip counts and revenue breakdowns.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
      - name: taxi_trips
        description: "Total taxi trips across all types (yellow + green + fhv + fhvhv)."
        tests:
          - not_null
      - name: yellow_trips
        description: "Yellow medallion taxi trips."
      - name: green_trips
        description: "Green borough taxi trips."
      - name: fhv_trips
        description: "Traditional for-hire vehicle trips."
      - name: fhvhv_trips
        description: "High-volume for-hire vehicle trips (Uber, Lyft, etc.)."

  - name: fact_restaurant_inspections
    description: >
      Restaurant inspection facts — one row per inspection with aggregated
      violations.  Supports cuisine × grade analysis, time-series of scores.
    columns:
      - name: camis
        tests:
          - not_null
      - name: inspection_date
        tests:
          - not_null
      - name: grade
        tests:
          - accepted_values:
              values: ['A', 'B', 'C', 'Z', 'P', 'N']

  - name: fact_nypd_complaints
    description: >
      NYPD complaint facts with geospatial coordinates for taxi zone joins
      and demographic dimensions for crime pattern analysis.
    columns:
      - name: complaint_num
        description: "NYPD complaint number.  May contain duplicates in the source data."
        tests:
          - not_null
      - name: complaint_date
        tests:
          - not_null
      - name: boro
        tests:
          - not_null
