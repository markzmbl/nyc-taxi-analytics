# Airbyte connection configuration for NYC Citi Bike Trips
# This file documents the expected Airbyte connection.
# Configure via:  bash airbyte/setup_connections.sh
#   or manually in the Airbyte UI at http://localhost:8000
#
# Source: S3 (tripdata bucket — public, us-east-1)
#   - Format: CSV (gzipped via .zip extension)
#   - Globs both NYC (*-citibike-tripdata.csv.zip)
#             and JC  (JC-*-citibike-tripdata.csv.zip)
#   - Compression: zip (must be explicitly configured in source definition)
# Destination: PostgreSQL (raw schema)
#   - Table: raw.citibike_trips
#
# Sync strategy: Incremental | Append + Dedup
#   Uses started_at as cursor field with a 7-day lookback window.
#   Destination mode is append_dedup using natural primary keys for
#   idempotent reprocessing.  Watermarks tracked in raw._watermarks.
#   Tripdata publishes monthly files; incremental means we only process
#   net-new files rather than re-scanning ~60M rows of history.
#
#   Cursor field:  started_at
#   Lookback window: 7 days (handles late-arriving tripdata corrections)
#
# Schedule: Monthly on the 5th (Tripdata publishes monthly, offset from taxi)
#   Cron: 0 3 5 * *

connection:
  name: nyc-citibike-trips
  source: s3
  destination: postgres
  schedule: "0 3 5 * *"   # monthly, 5th day at 03:00 UTC (offset from taxi)
  sync_mode: incremental_append_dedup
  lookback_window_days: 7
  streams:
    - name: citibike-trips
      glob: "*-citibike-tripdata.csv.zip"
      format: csv
      compression: zip
      destination_table: raw.citibike_trips
      description: Citi Bike trips (NYC + JC), ~60M rows total, 2013-present
      sync_mode: incremental
      cursor_field: [started_at]
      destination_sync_mode: append_dedup
      primary_key: [started_at, ended_at, start_station_id, end_station_id, ride_id]
