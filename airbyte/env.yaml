# Airbyte workspace environment configuration
# This documents the sources/destinations expected in the Airbyte workspace.
# Configure these in the Airbyte UI at http://localhost:8000

workspace:
  name: nyc-taxi-analytics

sources:
  - name: azure-blob-storage
    type: azure-blob-storage
    config:
      account: azureopendatastorage
      container: nyctlc
      # Public container — no access key needed
      streams:
        - name: taxi_trips
          prefix: yellow/
          glob: yellow/puYear=*/puMonth=*/*.parquet
          format: parquet
          description: Yellow taxi trips (Manhattan-centric street-hail), 2009-present
        - name: taxi_trips_green
          prefix: green/
          glob: green/puYear=*/puMonth=*/*.parquet
          format: parquet
          description: Green taxi trips (outer-borough street-hail livery), 2013-present
        - name: taxi_trips_fhv
          prefix: fhv/
          glob: fhv/puYear=*/puMonth=*/*.parquet
          format: parquet
          description: For-Hire Vehicle trips (Uber/Lyft/Via/Juno base), 2015-present
        - name: taxi_trips_fhvhv
          prefix: fhvhv/
          glob: fhvhv/puYear=*/puMonth=*/*.parquet
          format: parquet
          description: High Volume FHV trips (app-based + TLC-licensed), 2019-present

  - name: citibike-s3
    type: s3
    config:
      bucket: tripdata
      region: us-east-1
      # Public bucket — no AWS credentials needed
      streams:
        - name: citibike-trips
          glob: "*-citibike-tripdata.csv.zip"
          format: csv
          compression: zip
          description: Citi Bike trip data (NYC + Jersey City), 2013-present

  - name: tlc-zone-lookup
    type: http
    config:
      url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
      format: csv
      description: >
        TLC taxi zone lookup (location_id → borough, zone, service_zone, lat/lon).
        Published by NYC TLC, updated infrequently (zone changes are rare).
        Auto-refreshable via Airbyte vs. dbt seed (version-controlled, simpler).
        Trade-off: Airbyte-sourced can drift if TLC changes schema; dbt seed
        is pinned but requires manual updates.

destinations:
  - name: warehouse-postgres
    type: postgres
    config:
      host: ${PG_HOST}
      port: 5432
      database: warehouse
      schema: raw
      username: ${PG_USER}
      password: ${PG_PASSWORD}
